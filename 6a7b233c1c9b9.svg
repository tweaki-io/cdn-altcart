<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C3AE3"/>
      <stop offset="100%" stop-color="#2A1E8F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A5B"/>
      <stop offset="100%" stop-color="#FF5D4A"/>
    </linearGradient>
  </defs>

  <!-- Round badge -->
  <circle cx="100" cy="100" r="96" fill="url(#badgeGrad)"/>

  <!-- Cart basket -->
  <path d="M62 86 L138 86 L127 138 L73 138 Z"
        fill="none" stroke="#FFFFFF" stroke-width="8"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cart handle -->
  <path d="M44 72 L65 72 L73 86"
        fill="none" stroke="#FFFFFF" stroke-width="8"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="85" cy="150" r="8" fill="#FFFFFF"/>
  <circle cx="117" cy="150" r="8" fill="url(#accentGrad)"/>

  <!-- "Alt" swap-arrows accent, top-right -->
  <g transform="translate(128,50)">
    <path d="M0 6 A12 12 0 0 1 22 3" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="22,3 16,0 18,7" fill="#FF5D4A"/>
    <path d="M22 14 A12 12 0 0 1 0 17" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <polygon points="0,17 6,20 4,13" fill="#FFFFFF"/>
  </g>
</svg>
